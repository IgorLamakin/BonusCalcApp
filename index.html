<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
        />
        <title>Калькулятор премии</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="app">
            <header class="masthead">
                <div class="logo">
                    <img src="assets/logo.png" alt="" id="logoImg" />
                </div>
                <div class="masthead-text">
                    <h1>Калькулятор премии</h1>
                    <p class="sub">Расчёт рентабельности и бонуса сделки</p>
                </div>
                <span class="version" id="versionLabel"></span>
            </header>

            <div class="update-banner" id="updateBanner" hidden role="status" aria-live="polite">
                <span class="update-text" id="updateText"></span>
                <span class="update-actions">
                    <button type="button" class="ghost-btn accent" id="updateAction" hidden>
                        Обновить
                    </button>
                    <button
                        type="button"
                        class="ghost-btn"
                        id="updateDismiss"
                        aria-label="Скрыть уведомление об обновлении"
                    >
                        ×
                    </button>
                </span>
            </div>

            <div class="tabs" role="tablist" aria-label="Режим расчёта">
                <button
                    type="button"
                    class="tab active"
                    id="tab1"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panel1"
                >
                    Расчёт 1 · Выручка
                </button>
                <button
                    type="button"
                    class="tab"
                    id="tab2"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panel2"
                >
                    Расчёт 2 · Маржа
                </button>
            </div>

            <section class="calc-panel active" id="panel1" role="tabpanel" aria-labelledby="tab1">
                <form class="panel" id="dealForm" novalidate>
                    <div class="field">
                        <label for="companyName">Название компании</label>
                        <input
                            type="text"
                            id="companyName"
                            maxlength="120"
                            placeholder="Например, ООО «Альфа»"
                            autocomplete="off"
                        />
                    </div>

                    <div class="field">
                        <label for="revenue">Выручка (с НДС)</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="revenue"
                                inputmode="decimal"
                                placeholder="0"
                                autocomplete="off"
                                aria-describedby="revenueError"
                            />
                            <span class="unit" aria-hidden="true">₽</span>
                        </div>
                        <p class="field-error" id="revenueError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="purchase">Закупка (с НДС)</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="purchase"
                                inputmode="decimal"
                                placeholder="0"
                                autocomplete="off"
                                aria-describedby="purchaseError"
                            />
                            <span class="unit" aria-hidden="true">₽</span>
                        </div>
                        <p class="field-error" id="purchaseError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="logistics">Логистика (с НДС)</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="logistics"
                                inputmode="decimal"
                                placeholder="0"
                                autocomplete="off"
                                aria-describedby="logisticsError"
                            />
                            <span class="unit" aria-hidden="true">₽</span>
                        </div>
                        <p class="field-error" id="logisticsError" role="alert"></p>
                    </div>

                    <div class="field">
                        <div class="range-head">
                            <label for="bonusPercent">Процент премии</label>
                            <div class="percent-input">
                                <input
                                    type="text"
                                    id="bonusPercentInput"
                                    inputmode="decimal"
                                    value="30"
                                    aria-label="Процент премии, числом"
                                    aria-describedby="bonusPercentError"
                                />
                                <span class="unit" aria-hidden="true">%</span>
                            </div>
                        </div>
                        <input
                            type="range"
                            id="bonusPercent"
                            min="0"
                            max="100"
                            step="1"
                            value="30"
                            aria-label="Процент премии, ползунок"
                        />
                        <p class="field-error" id="bonusPercentError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="vatPercent">Ставка НДС</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="vatPercent"
                                inputmode="decimal"
                                value="20"
                                aria-describedby="vatPercentError"
                            />
                            <span class="unit" aria-hidden="true">%</span>
                        </div>
                        <p class="field-error" id="vatPercentError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="incomeTaxPercent">Налог на прибыль</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="incomeTaxPercent"
                                inputmode="decimal"
                                value="20"
                                aria-describedby="incomeTaxPercentError"
                            />
                            <span class="unit" aria-hidden="true">%</span>
                        </div>
                        <p class="field-error" id="incomeTaxPercentError" role="alert"></p>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-calc" id="btnCalc">Рассчитать</button>
                        <button type="button" class="btn btn-excel" id="btnExcel" disabled>
                            Excel
                        </button>
                        <button type="button" class="btn btn-pdf" id="btnPdf" disabled>PDF</button>
                    </div>

                    <div id="results" class="results hidden" aria-live="polite">
                        <div class="row" id="rowMargin">
                            <span class="k">Маржа</span>
                            <span class="v" id="resMargin">0,00 ₽</span>
                        </div>
                        <div class="row deduction">
                            <span class="k">НДС к уплате</span>
                            <span class="v" id="resVat">0,00 ₽</span>
                        </div>
                        <div class="row deduction">
                            <span class="k">Налог на прибыль</span>
                            <span class="v" id="resTax">0,00 ₽</span>
                        </div>
                        <div class="row net" id="rowProfit">
                            <span class="k">Чистая прибыль</span>
                            <span class="v" id="resProfit">0,00 ₽</span>
                        </div>
                        <div class="bonus-box">
                            <span class="t">Премия</span>
                            <span class="val" id="resBonus">0,00 ₽</span>
                        </div>
                    </div>
                </form>
            </section>

            <section class="calc-panel" id="panel2" role="tabpanel" aria-labelledby="tab2">
                <form class="panel" id="marginForm" novalidate>
                    <div class="field">
                        <label for="managerName">Менеджер</label>
                        <input
                            type="text"
                            id="managerName"
                            maxlength="120"
                            placeholder="ФИО менеджера"
                            autocomplete="off"
                        />
                    </div>

                    <div class="field">
                        <label for="margin2">Маржа</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="margin2"
                                inputmode="decimal"
                                placeholder="0"
                                autocomplete="off"
                                aria-describedby="margin2Error"
                            />
                            <span class="unit" aria-hidden="true">₽</span>
                        </div>
                        <p class="field-error" id="margin2Error" role="alert"></p>
                    </div>

                    <div class="field">
                        <div class="range-head">
                            <label for="bonusPercent2">Процент премии</label>
                            <div class="percent-input">
                                <input
                                    type="text"
                                    id="bonusPercent2Input"
                                    inputmode="decimal"
                                    value="30"
                                    aria-label="Процент премии, числом"
                                    aria-describedby="bonusPercent2Error"
                                />
                                <span class="unit" aria-hidden="true">%</span>
                            </div>
                        </div>
                        <input
                            type="range"
                            id="bonusPercent2"
                            min="0"
                            max="100"
                            step="1"
                            value="30"
                            aria-label="Процент премии, ползунок"
                        />
                        <p class="field-error" id="bonusPercent2Error" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="vatPercent2">Ставка НДС</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="vatPercent2"
                                inputmode="decimal"
                                value="20"
                                aria-describedby="vatPercent2Error"
                            />
                            <span class="unit" aria-hidden="true">%</span>
                        </div>
                        <p class="field-error" id="vatPercent2Error" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="incomeTaxPercent2">Налог на прибыль</label>
                        <div class="input-wrap">
                            <input
                                type="text"
                                id="incomeTaxPercent2"
                                inputmode="decimal"
                                value="20"
                                aria-describedby="incomeTaxPercent2Error"
                            />
                            <span class="unit" aria-hidden="true">%</span>
                        </div>
                        <p class="field-error" id="incomeTaxPercent2Error" role="alert"></p>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-calc" id="btnCalc2">Рассчитать</button>
                        <button type="button" class="btn btn-excel" id="btnExcel2" disabled>
                            Excel
                        </button>
                        <button type="button" class="btn btn-pdf" id="btnPdf2" disabled>PDF</button>
                    </div>

                    <div id="results2" class="results hidden" aria-live="polite">
                        <div class="row deduction">
                            <span class="k">НДС к уплате</span>
                            <span class="v" id="resVat2">0,00 ₽</span>
                        </div>
                        <div class="row deduction">
                            <span class="k">Налог на прибыль</span>
                            <span class="v" id="resTax2">0,00 ₽</span>
                        </div>
                        <div class="row net" id="rowProfit2">
                            <span class="k">Чистая прибыль</span>
                            <span class="v" id="resProfit2">0,00 ₽</span>
                        </div>
                        <div class="bonus-box">
                            <span class="t">Премия</span>
                            <span class="val" id="resBonus2">0,00 ₽</span>
                        </div>
                    </div>
                </form>
            </section>

            <section class="history" aria-labelledby="historyTitle">
                <div class="history-head">
                    <h2 id="historyTitle">История расчётов</h2>
                    <span class="count" id="histCount">0 зап.</span>
                    <div class="history-actions">
                        <button type="button" class="ghost-btn" id="btnExportCsv" hidden>
                            Выгрузить CSV
                        </button>
                        <button type="button" class="ghost-btn danger" id="btnClearHistory" hidden>
                            Очистить
                        </button>
                    </div>
                </div>
                <div class="history-list" id="histList" role="list"></div>
            </section>

            <footer class="app-footer">
                <button type="button" class="link-btn" id="btnOpenData">Папка с данными</button>
                <span class="dot" aria-hidden="true">·</span>
                <button type="button" class="link-btn" id="btnCheckUpdates">
                    Проверить обновления
                </button>
                <span class="dot" aria-hidden="true">·</span>
                <span id="footerVersion">—</span>
            </footer>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script src="src/shared/calc.js"></script>
        <script src="app.js"></script>
    </body>
</html>
