<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self'">
    <title>Калькулятор премии</title>
    <style>
        :root {
            --bg-0: #0a1018;
            --bg-1: #0e1a2f;
            --panel: #111d36;
            --panel-2: #0d172c;
            --line: rgba(148, 163, 184, 0.14);
            --text: #e8eef7;
            --text-dim: #8ea2c0;
            --gold: #f0b14a;
            --gold-soft: rgba(240, 177, 74, 0.14);
            --green: #3ddc97;
            --green-soft: rgba(61, 220, 151, 0.13);
            --red: #ff6b6b;
            --accent: #4f8cff;
            --accent-2: #2f6bd8;
            --danger: #ff6b6b;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', 'Manrope', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1000px 620px at 85% -5%, rgba(79, 140, 255, 0.20), transparent 58%),
                radial-gradient(820px 560px at -5% 108%, rgba(240, 177, 74, 0.11), transparent 55%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1));
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            padding: 18px;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        input,
        button {
            -webkit-user-select: auto;
            user-select: auto;
        }

        .app {
            width: 100%;
            max-width: 470px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Вкладки переключения расчётов */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 5px;
        }

        .tab {
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            padding: 10px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .18s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(79, 140, 255, 0.22), rgba(47, 107, 216, 0.18));
            color: var(--text);
            box-shadow: 0 6px 16px -8px rgba(79, 140, 255, 0.6);
        }

        .calc-panel {
            display: none;
        }

        .calc-panel.active {
            display: block;
        }

        /* Верхняя шапка */
        .masthead {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 2px;
        }

        .masthead .logo {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 26px rgba(79, 140, 255, 0.38);
            flex-shrink: 0;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .masthead .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .masthead h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .masthead .sub {
            font-size: 12.5px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .panel {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px 20px 18px;
            box-shadow: 0 26px 60px -30px rgba(0, 0, 0, 0.75);
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .cur {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
            pointer-events: none;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            outline: none;
            transition: border-color .18s, background .18s, box-shadow .18s;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #5a6b85;
            font-weight: 500;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: var(--accent);
            background: rgba(79, 140, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.14);
        }

        input.input-error {
            border-color: var(--red) !important;
            background: rgba(255, 107, 107, 0.06) !important;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.14) !important;
        }

        /* Слайдер */
        .range-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .range-head label {
            margin-bottom: 0;
        }

        .range-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 0%, rgba(148, 163, 184, .25) 0%);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid var(--accent);
            box-shadow: 0 4px 14px rgba(79, 140, 255, 0.5);
            transition: transform .15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 9px;
            margin-top: 2px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .12s, box-shadow .18s, opacity .18s, filter .18s;
            flex: 1;
            color: #fff;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-calc {
            background: linear-gradient(135deg, var(--accent), #2f6bd8);
            box-shadow: 0 12px 26px -12px rgba(79, 140, 255, 0.65);
        }

        .btn-calc:hover {
            filter: brightness(1.06);
        }

        .btn-excel {
            background: linear-gradient(135deg, #1f9d61, #177a4b);
        }

        .btn-pdf {
            background: linear-gradient(135deg, #e04b4b, #b63132);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        /* Результаты */
        .results {
            margin-top: 16px;
            padding-top: 15px;
            border-top: 1px dashed var(--line);
            display: grid;
            gap: 9px;
            animation: fadeUp .35s ease both;
        }

        .results.hidden {
            display: none;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
        }

        .row .k {
            color: var(--text-dim);
        }

        .row .v {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .row.neg .v {
            color: var(--red);
        }

        .row.net .v {
            color: var(--green);
            font-size: 15px;
            font-weight: 800;
        }

        .bonus-box {
            margin-top: 12px;
            background: var(--gold-soft);
            border: 1px solid rgba(240, 177, 74, 0.35);
            border-radius: 14px;
            padding: 13px 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bonus-box .t {
            font-size: 13px;
            font-weight: 600;
            color: #c9963d;
        }

        .bonus-box .val {
            font-size: 23px;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        /* История */
        .history {
            margin-top: 2px;
        }

        .history-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 2px 9px;
        }

        .history-head h2 {
            font-size: 15px;
            font-weight: 700;
        }

        .history-head .count {
            color: var(--text-dim);
            font-size: 12.5px;
            margin-left: auto;
            margin-right: 10px;
        }

        .history-list {
            display: grid;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 99px;
        }

        .hitem {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 11px 13px;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .1s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hitem:hover {
            border-color: rgba(79, 140, 255, 0.4);
            background: rgba(79, 140, 255, 0.05);
            transform: translateY(-1px);
        }

        .hitem .main {
            flex: 1;
            min-width: 0;
        }

        .hitem .name {
            font-size: 13.5px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hitem .meta {
            font-size: 11.5px;
            color: var(--text-dim);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hitem .bonus {
            font-size: 15px;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .hitem .del {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 16px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity .15s, color .15s, background .15s;
            line-height: 1;
        }

        .hitem:hover .del {
            opacity: 1;
        }

        .hitem .del:hover {
            color: var(--red);
            background: rgba(255, 107, 107, 0.12);
        }

        .empty {
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
            padding: 24px 10px;
            border: 1px dashed var(--line);
            border-radius: 13px;
        }

        .clear-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--text-dim);
            border-radius: 9px;
            padding: 5px 11px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }

        .clear-btn:hover {
            color: var(--red);
            border-color: rgba(255, 107, 107, 0.4);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%) translateY(20px);
            background: #1a2740;
            border: 1px solid var(--line);
            color: var(--text);
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 50;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="masthead">
            <div class="logo">
                <img src="assets/logo.png" alt="Логотип" id="logoImg">
            </div>
            <div>
                <h1>Калькулятор премии</h1>
                <div class="sub">Расчёт рентабельности и бонуса сделки</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab1">Расчёт 1 · Выручка</button>
            <button class="tab" id="tab2">Расчёт 2 · Маржа</button>
        </div>

        <div class="calc-panel active" id="panel1">
            <div class="panel">
                <div class="field-group">
                    <label for="companyName">Название компании</label>
                    <div class="input-wrap">
                        <input type="text" id="companyName" maxlength="120" placeholder="Например, ООО «Альфа»">
                    </div>
                </div>

                <div class="field-group">
                    <label for="revenue">Выручка (с НДС)</label>
                    <div class="input-wrap">
                        <input type="number" id="revenue" inputmode="decimal" placeholder="0" min="0">
                        <span class="cur">₽</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="purchase">Закупка (с НДС)</label>
                    <div class="input-wrap">
                        <input type="number" id="purchase" inputmode="decimal" placeholder="0" min="0">
                        <span class="cur">₽</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="logistics">Логистика (с НДС)</label>
                    <div class="input-wrap">
                        <input type="number" id="logistics" inputmode="decimal" placeholder="0" min="0">
                        <span class="cur">₽</span>
                    </div>
                </div>

                <div class="field-group">
                    <div class="range-head">
                        <label for="bonusPercent">Процент премии</label>
                        <span id="bonusPercentLabel" class="range-value">30%</span>
                    </div>
                    <input type="range" id="bonusPercent" min="1" max="50" value="30">
                </div>

                <div class="field-group">
                    <label for="vatPercent">Ставка НДС</label>
                    <div class="input-wrap">
                        <input type="number" id="vatPercent" inputmode="decimal" placeholder="20" min="0" max="100"
                            step="0.1" value="20">
                        <span class="cur">%</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="incomeTaxPercent">Налог на прибыль</label>
                    <div class="input-wrap">
                        <input type="number" id="incomeTaxPercent" inputmode="decimal" placeholder="20" min="0"
                            max="100" step="0.1" value="20">
                        <span class="cur">%</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-calc" id="btnCalc">Рассчитать</button>
                    <button class="btn btn-excel" id="btnExcel" disabled>Excel</button>
                    <button class="btn btn-pdf" id="btnPdf" disabled>PDF</button>
                </div>

                <div id="results" class="results hidden">
                    <div class="row"><span class="k">Маржа</span><span class="v" id="resMargin">0,00 ₽</span></div>
                    <div class="row neg"><span class="k">НДС</span><span class="v" id="resVAT">0,00 ₽</span></div>
                    <div class="row neg"><span class="k">Налог</span><span class="v" id="resTax">0,00 ₽</span></div>
                    <div class="row net"><span class="k">Чистая прибыль</span><span class="v" id="resNetProfit">0,00
                            ₽</span></div>
                    <div class="bonus-box">
                        <span class="t">Премия</span>
                        <span class="val" id="resBonus">0,00 ₽</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="calc-panel" id="panel2">
            <div class="panel">
                <div class="field-group">
                    <label for="managerName">Менеджер</label>
                    <div class="input-wrap">
                        <input type="text" id="managerName" maxlength="120" placeholder="ФИО менеджера">
                    </div>
                </div>

                <div class="field-group">
                    <label for="margin2">Маржа</label>
                    <div class="input-wrap">
                        <input type="number" id="margin2" inputmode="decimal" placeholder="0" min="0">
                        <span class="cur">₽</span>
                    </div>
                </div>

                <div class="field-group">
                    <div class="range-head">
                        <label for="bonusPercent2">Процент премии</label>
                        <span id="bonusPercent2Label" class="range-value">30%</span>
                    </div>
                    <input type="range" id="bonusPercent2" min="1" max="50" value="30">
                </div>

                <div class="field-group">
                    <label for="vatPercent2">Ставка НДС</label>
                    <div class="input-wrap">
                        <input type="number" id="vatPercent2" inputmode="decimal" placeholder="20" min="0" max="100"
                            step="0.1" value="20">
                        <span class="cur">%</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="incomeTaxPercent2">Налог на прибыль</label>
                    <div class="input-wrap">
                        <input type="number" id="incomeTaxPercent2" inputmode="decimal" placeholder="20" min="0"
                            max="100" step="0.1" value="20">
                        <span class="cur">%</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-calc" id="btnCalc2">Рассчитать</button>
                    <button class="btn btn-excel" id="btnExcel2" disabled>Excel</button>
                    <button class="btn btn-pdf" id="btnPdf2" disabled>PDF</button>
                </div>

                <div id="results2" class="results hidden">
                    <div class="row neg"><span class="k">НДС</span><span class="v" id="resVAT2">0,00 ₽</span></div>
                    <div class="row neg"><span class="k">Налог</span><span class="v" id="resTax2">0,00 ₽</span></div>
                    <div class="row net"><span class="k">Чистая прибыль</span><span class="v" id="resNetProfit2">0,00
                            ₽</span></div>
                    <div class="bonus-box">
                        <span class="t">Премия</span>
                        <span class="val" id="resBonus2">0,00 ₽</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-head">
                <h2>История расчётов</h2>
                <span class="count" id="histCount">0 зап.</span>
                <button class="clear-btn" id="btnClear" style="display:none">Очистить</button>
            </div>
            <div class="history-list" id="histList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="renderer.js"></script>
</body>

</html>
